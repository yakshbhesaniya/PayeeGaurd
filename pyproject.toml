[project]
name = "payeeguard"
version = "0.1.0"
description = "Autonomous accounts-payable trust desk: know your payee before money moves."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "mcp>=1.2", "python-dotenv>=1.0", "idna>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
